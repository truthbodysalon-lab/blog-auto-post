name: Ops - threads常駐ループの見張り

# 2026-10-19: Macが止まっていても、threads-auto-post の常駐ループ（Threads投稿・定刻起動・見張りが乗っている）の
# 停止に気づけるようにする。公開リポなので Actions は無料。止まっていたら Discord に通知（6時間に1回・復旧時1回）。
# ループの再起動は threads-auto-post 側の cron（2,32分）が担う。ここは知らせるだけ。
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ops-loop-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check threads-auto-post loop
        id: chk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 ops/loop_watch.py | tee /tmp/out.txt
          grep -q STATE_CHANGED /tmp/out.txt && echo "changed=1" >> "$GITHUB_OUTPUT" || true
      - name: Save state
        if: steps.chk.outputs.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/loop_watch_state.json
          git commit -m "chore: loop watch state [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
